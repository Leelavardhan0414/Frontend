<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypesOfCssStylings</title>
</head>
<style>
    <!---Internal CSS-->
    h1{
        background-color: aqua;
        color: rgb(192, 16, 16);
    }
    p{
        color: rgb(17, 219, 17);
        border: 2px solid black;
    }
</style>
<body>
    <!---Inline CSS-->
    <h1>Types of CSS Styling</h1>
    <hr>
    <br>
    <p style="background-color: lightgray; color:blue">Inline CSS</p>
    <p>Internal CSS</p>
    <p>External CSS</p>
</body>
</html>
